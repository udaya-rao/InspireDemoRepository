  <title>Inspire Magnetics</title>
  <style>
    /* Splash visual polish */
    #app-splash-logo {
      animation: splashPulse 1.6s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes splashPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.98;
      }

      50% {
        transform: scale(1.03);
        opacity: 1;
      }
    }

    #app-splash-bar {
      position: relative;
      border-radius: 999px;
      overflow: hidden;
    }

    #app-splash-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.35) 50%,
          rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
      animation: splashSheen 1.1s linear infinite;
      pointer-events: none;
    }

    @keyframes splashSheen {
      0% {
        background-position-x: -200%;
      }

      100% {
        background-position-x: 200%;
      }
    }
  </style>
</head>

<body>
  <!-- Instant HTML splash (shown before JS loads) -->
  <div id="app-splash" style="
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 99999;
      ">
    <div style="
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
        ">
      <img id="app-splash-logo" src="/inspire-magnetics-logo-1.png" alt="Inspire Magnetics"
        style="height: 100px; opacity: 1; width: 250px" />

      <div style="
            width: 240px;
            height: 8px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.08);
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
          ">
        <div id="app-splash-bar" style="
              width: 0;
              height: 100%;
              background: linear-gradient(90deg, #22c55e, #16a34a);
            "></div>
      </div>
    </div>
  </div>

  <div id="root"></div>
